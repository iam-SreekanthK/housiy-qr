# Rendered by the Jenkins pipeline (plain string substitution, no
# envsubst needed) before `kubectl apply` - works the same on Linux and
# Windows agents. Required placeholders at render time:
#   APP_IMAGE           e.g. localhost:8051/housiy-app (registry) or
#                        just housiy-app (local-only image, no registry)
#   APP_IMAGE_TAG       stg-<build> for stg, or the release version tag
#                        (v1.YYYY.MM.DD.<build number>) for prod
#   NAMESPACE           housiy-stg | housiy-prod
#   REPLICAS            pod count for this environment
#   APP_ENV             staging | production
#   IMAGE_PULL_POLICY   IfNotPresent (stg - image only exists in the local
#                        Docker engine) | Always (prod - pulled from Nexus)
#
# Prerequisite (created once per namespace, out of band - never by CI):
#   kubectl create secret generic housiy-db-credentials -n <namespace> \
#     --from-literal=DB_HOST=<host> \
#     --from-literal=DB_NAME=housiy \
#     --from-literal=DB_USER=<user> \
#     --from-literal=DB_PASS=<password>

apiVersion: v1
kind: ConfigMap
metadata:
  name: housiy-web-config
  namespace: ${NAMESPACE}
data:
  default.conf.template: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }
    server {
      listen 8080;
      server_name _;
      root /var/www/html;
      index index.html;
      client_max_body_size 4m;
      server_tokens off;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      location = /ws {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $realtime_upstream ${REALTIME_UPSTREAM};
        proxy_pass http://$realtime_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
      }
      location ~ ^/api/([A-Za-z0-9_-]+\.php)$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html;
        fastcgi_param HTTP_PROXY "";
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
      }
      location ~ \.php(?:/|$) { return 404; }
      location ~* /\.(?!well-known/) { deny all; }
      location / { try_files $uri $uri/ =404; }
    }
  www.conf: |
    [www]
    user = www-data
    group = www-data
    listen = 9000
    pm = dynamic
    pm.max_children = 8
    pm.start_servers = 2
    pm.min_spare_servers = 2
    pm.max_spare_servers = 4
    pm.max_requests = 500
    request_terminate_timeout = 60s
    clear_env = no
    catch_workers_output = yes
    decorate_workers_output = no
    access.log = /proc/self/fd/2
    php_admin_flag[log_errors] = on
    php_admin_flag[display_errors] = off
    php_admin_value[error_log] = /proc/self/fd/2
    php_admin_value[session.save_path] = /tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: housiy-app
  namespace: ${NAMESPACE}
  labels:
    app: housiy-app
spec:
  replicas: ${REPLICAS}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: housiy-app
  template:
    metadata:
      labels:
        app: housiy-app
    spec:
      initContainers:
        - name: populate-app-source
          image: ${APP_IMAGE}:${APP_IMAGE_TAG}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          command: ["sh", "-lc", "cp -a /var/www/html/. /shared/ && chmod -R a+rX /shared"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app-source
              mountPath: /shared
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: housiy-app
          image: ${APP_IMAGE}:${APP_IMAGE_TAG}
          # stg uses IfNotPresent (image only exists in the local Docker
          # engine, never pushed anywhere - see the Jenkinsfile header).
          # prod uses Always since it pulls an immutable version tag from
          # Nexus and should never silently reuse a stale local layer.
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9000
          env:
            - name: APP_ENV
              value: "${APP_ENV}"
            - name: DB_PORT
              value: "3306"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: housiy-db-credentials
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: housiy-db-credentials
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: housiy-db-credentials
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: housiy-db-credentials
                  key: DB_PASS
            # Optional realtime/Redis wiring. Inert unless the ConfigMap
            # housiy-realtime-config exists (see realtime/README section in
            # ../../README.md): without it the app polls exactly as before.
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: housiy-realtime-config
                  key: REDIS_HOST
                  optional: true
            - name: REALTIME_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: housiy-realtime-config
                  key: REALTIME_UPSTREAM
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: housiy-redis
                  key: REDIS_PASSWORD
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: app-source
              mountPath: /var/www/html
              readOnly: true
            - name: php-pool
              mountPath: /usr/local/etc/php-fpm.d/www.conf
              subPath: www.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-lc"]
          args:
            - 'export REALTIME_UPSTREAM="${REALTIME_UPSTREAM:-127.0.0.1:8090}"; envsubst ''${REALTIME_UPSTREAM}'' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf; exec nginx -g "daemon off;"'
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: REALTIME_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: housiy-realtime-config
                  key: REALTIME_UPSTREAM
                  optional: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: app-source
              mountPath: /var/www/html
              readOnly: true
            - name: web-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app-source
          emptyDir: {}
        - name: php-pool
          configMap:
            name: housiy-web-config
            items:
              - key: www.conf
                path: www.conf
        - name: web-config
          configMap:
            name: housiy-web-config
            items:
              - key: default.conf.template
                path: default.conf.template
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
