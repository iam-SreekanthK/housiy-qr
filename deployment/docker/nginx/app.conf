
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.html;

    client_max_body_size 4m;
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Temporary PHP-FPM diagnostics.
    # Restrict this endpoint further or remove it after testing.
    location = /__fpm_status {
        allow 127.0.0.1;
        allow 172.18.0.0/16;
        deny all;

        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
        fastcgi_pass php:9001;
    }

    # Realtime WebSocket gateway
    location = /ws {
        resolver 127.0.0.11 valid=1s ipv6=off;
        resolver_timeout 2s;
        set $realtime_upstream realtime:8090;

        proxy_pass http://$realtime_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Only named API entrypoints may execute PHP
    location ~ ^/api/([A-Za-z0-9_-]+\.php)$ {
        try_files $uri =404;

        include /etc/nginx/fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html;
        fastcgi_param HTTP_PROXY "";

        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_buffering on;
    }

    # Deny other PHP execution
    location ~ \.php(?:/|$) {
        return 404;
    }

    # Deny hidden files
    location ~* /\.(?!well-known/) {
        deny all;
    }

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }
}
