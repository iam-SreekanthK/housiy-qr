# SonarQube project configuration for Housiy.
# Server: http://localhost:8052/
#
# In Jenkins, withSonarQubeEnv('SonarQube') injects the server URL and
# auth token automatically, overriding sonar.host.url below - the token
# itself is never stored in this file (see Jenkinsfile header comment for
# the required 'housiy-sonar-token' credential).
#
# For a manual, outside-Jenkins run:
#   export SONAR_TOKEN=<your SonarQube user token>
#   sonar-scanner -Dsonar.token=$SONAR_TOKEN
sonar.host.url=http://localhost:8052

sonar.projectKey=housiy-platform
sonar.projectName=Housiy Platform
# projectVersion is intentionally omitted here - the Jenkinsfile always
# passes it on the CLI (-Dsonar.projectVersion=$BUILD_NUMBER), which
# overrides anything in this file. Java properties files don't expand
# ${VAR} placeholders, so a literal one here would just read as the
# string "${BUILD_NUMBER}" on a manual `sonar-scanner` run.

# PHP application code + vanilla JS frontend live under src/; tests live
# under tests/ but are excluded from "sources" and analyzed separately as
# tests so Sonar doesn't apply production coding-rule severities to them.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Third-party/vendored and generated content never gets analyzed.
sonar.exclusions=\
  src/assets/vendor/**,\
  src/assets/**/*.min.js,\
  src/assets/**/*.min.css,\
  vendor/**,\
  node_modules/**,\
  tests/ui/node_modules/**,\
  tests/load/results/**

sonar.test.exclusions=\
  tests/ui/node_modules/**,\
  tests/load/results/**

# Test result / coverage report ingestion. All paths are relative to this
# file and are produced by the Jenkinsfile's "Test" stages before the
# SonarQube Analysis stage runs - missing files are skipped by the
# scanner rather than failing the build, so this still works if coverage
# generation is unavailable on a given agent (e.g. no Xdebug/PCOV).
sonar.php.tests.reportPath=tests-results/phpunit-junit.xml
sonar.php.coverage.reportPaths=tests-results/phpunit-coverage.xml
sonar.javascript.lcov.reportPaths=tests-results/playwright-coverage.lcov

# Generic JUnit-format execution reports for the non-PHP suites (Playwright
# UI tests and k6 load test thresholds), so failures/pass-rate for those
# show up in Sonar's own test reporting too, not just Jenkins.
sonar.testExecutionReportPaths=\
  tests-results/playwright-junit.xml,\
  tests-results/k6-junit.xml
  
