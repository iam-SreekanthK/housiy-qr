# Rendered by the Jenkins pipeline (plain string substitution, no
# envsubst needed) before `kubectl apply`. Required placeholders:
#   NAMESPACE, NODE_PORT (host port, 30000-32767, that routes to the app)

apiVersion: v1
kind: Service
metadata:
  name: housiy-app
  namespace: ${NAMESPACE}
  labels:
    app: housiy-app
spec:
  type: NodePort
  selector:
    app: housiy-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: ${NODE_PORT}
