[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 32 workers reduced p95 latency versus 24 in the 2026-10-25 Housiy load run.
; Monitor container RSS, MySQL connections and queue depth before increasing further.
; PHP-FPM capacity is not the same as 500 concurrent users: each request may queue.
pm = static
pm.max_children = 40
;pm.start_servers = 8
;pm.min_spare_servers = 8
;pm.max_spare_servers = 20
pm.max_requests = 500
pm.status_path = /fpm-status
pm.status_listen = 0.0.0.0:9001

; Fail/recycle wedged workers rather than letting them hold DB connections forever.
request_terminate_timeout = 60s
request_slowlog_timeout = 3s
slowlog = /proc/self/fd/2

; Expose container-provided DB/Redis/app settings to PHP scripts.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
access.format = "%R %t \"%m %r\" %s %{milliseconds}dms"

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[max_execution_time] = 55
php_admin_value[session.save_path] = /tmp
