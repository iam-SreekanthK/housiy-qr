apiVersion: apps/v1
kind: Deployment
metadata:
  name: housiy-app
  labels:
    {{- include "housiy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: housiy-app }
  template:
    metadata:
      labels: { app: housiy-app }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: copy-source
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "cp -a /var/www/html/. /shared/ && chmod -R a+rX /shared"]
          volumeMounts: [{ name: source, mountPath: /shared }]
      containers:
        - name: php
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: fpm, containerPort: 9000 }]
          env:
            - { name: APP_ENV, value: production }
            - { name: DB_PORT, value: "3306" }
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: housiy-runtime, key: DB_HOST } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: housiy-runtime, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: housiy-runtime, key: DB_USER } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: housiy-runtime, key: DB_PASS } }
            - { name: REDIS_HOST, value: housiy-redis }
            - { name: REDIS_PREFIX, value: housiy }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: housiy-runtime, key: REDIS_PASSWORD } }
          readinessProbe: { tcpSocket: { port: 9000 }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 9000 }, initialDelaySeconds: 15, periodSeconds: 15 }
          resources: {{- toYaml .Values.resources.app | nindent 12 }}
          volumeMounts:
            - { name: source, mountPath: /var/www/html, readOnly: true }
            - { name: tmp, mountPath: /tmp }
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /index.html, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /index.html, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 15 }
          volumeMounts:
            - { name: source, mountPath: /var/www/html, readOnly: true }
            - { name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: source, emptyDir: {} }
        - { name: nginx-config, configMap: { name: housiy-nginx } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: housiy-app
spec:
  type: {{ .Values.service.type }}
  selector: { app: housiy-app }
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: 8080 }
